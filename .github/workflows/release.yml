name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0-beta.1)'
        required: true
        type: string
  # A change to this workflow builds every target and the packages, so a
  # broken build is caught before a tag depends on it. On pull requests
  # signing, attestation, publish and docker are skipped: nothing is
  # signed or pushed.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/build-static-linux.sh'
      - 'scripts/release/check-portable-linux.sh'
      - 'scripts/release/split-debug.sh'
      - 'scripts/release/Dockerfile.scratch'

permissions:
  contents: write       # Upload release assets
  id-token: write       # Sigstore keyless OIDC
  attestations: write   # GitHub-native attestation (in-toto Statement)

env:
  # Pull requests have no tag (ref_name is "<n>/merge"), so they package
  # under a placeholder version.
  EUXIS_VERSION: ${{ github.event.inputs.tag || (github.event_name == 'pull_request' && 'v0.0.0-pr') || github.ref_name }}
  # Linux release binaries are built in Alpine (musl, fully static).
  # Pinned by the multi-arch index digest; same pin as cpp.yml.
  EUXIS_ALPINE_IMAGE: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are fully static (musl) and target the baseline
          # ISA. Through v0.0.15 they needed glibc 2.38, libstdc++ 13+,
          # OpenSSL 3 and SQLite from the host, plus AVX2 / ARMv8.4.
          - target: linux-amd64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          # darwin-amd64 (Intel) was sourced from macos-13. That runner pool
          # is starved (GitHub's Intel sunset) and PR #99 dropped it from
          # the regular C++ CI for the same reason. Drop here too; Apple
          # Silicon coverage via macos-15 is the path forward.
          # Self-contained: OpenSSL and libsodium linked statically, so the
          # binary needs only macOS's own libraries. Through v0.0.16 it
          # loaded brotli, libsodium and openssl@4 from /opt/homebrew.
          - target: darwin-arm64
            os: macos-15
            cmake_args: -DEUXIS_NATIVE_ARCH=OFF -DEUXIS_PORTABLE_ARCH=ON -DEUXIS_STATIC_DEPS=ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build static binary (Linux, Alpine musl)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e EUXIS_UID="$(id -u)" -e EUXIS_GID="$(id -g)" "$EUXIS_ALPINE_IMAGE" \
            scripts/release/build-static-linux.sh cmake-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use Apple Clang (matches the SDK) instead of Homebrew LLVM 22.
          # PR #99 found that Homebrew LLVM 22.1.7's libc++ wrappers can't
          # find <string.h> via the GitHub runner SDK — same root cause
          # surfaced on the release.yml v0.1.2 darwin-arm64 build. Apple
          # Clang lacks <generator> but the CLI binary does not need that
          # path (it's only exercised by the streaming test code).
          brew install libsodium sqlite pkg-config openssl@4
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@4)" >> "$GITHUB_ENV"

      - name: Configure (Release + LTO, macOS)
        if: runner.os == 'macOS'
        # EuxisDefaults.cmake turns ASan/UBSan on unless told otherwise.
        # Through v0.0.12 every release binary shipped instrumented, and
        # the macOS one needed libclang_rt.asan from the build runner's
        # Xcode to start at all.
        run: |
          cmake -B cmake-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DEUXIS_DISABLE_SANITIZERS=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            ${{ matrix.cmake_args }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        # `--parallel` defaults to nproc which on ubuntu-24.04-arm (4 vCPU
        # / 16 GB) OOM-kills the runner under Release builds — the heavy
        # generator / runtime TUs alone need ~3 GB peak each. Pinning to
        # `--parallel 2` keeps the build under the memory ceiling and
        # finishes inside the release-window budget.
        run: cmake --build cmake-build --parallel 2 --target euxis-cli

      - name: No sanitizer runtime linked
        run: |
          bin=cmake-build/apps/cli/euxis-cli
          if [ "$RUNNER_OS" = macOS ]; then
            libs=$(otool -L "$bin")
          else
            # Static: a sanitizer would be linked in, so look for its symbols.
            libs=$(nm "$bin" | grep -E ' __(a|ub|t|l)san_' || true)
          fi
          echo "$libs"
          if echo "$libs" | grep -Ei 'asan|ubsan|tsan|lsan'; then
            echo "::error::release binary links a sanitizer runtime"
            exit 1
          fi

      - name: Split debug info and strip
        # Ships a stripped binary (34 MB -> 21 MB on Linux) and its debug
        # info as a separate -debug.tar.gz asset: <name>.debug (ELF, found
        # through .gnu_debuglink or the build ID) or <name>.dSYM (macOS).
        # Every later check runs on the stripped binary that ships.
        run: |
          scripts/release/split-debug.sh cmake-build/apps/cli/euxis-cli \
            "euxis-${EUXIS_VERSION}-${{ matrix.target }}"

      - name: Smoke test
        run: ./cmake-build/apps/cli/euxis-cli --version

      - name: Binary version matches the tag
        # v0.0.13 was tagged before the source version moved and shipped
        # binaries that print v0.0.12. Pull requests package under a
        # placeholder version, so the check only applies to real tags.
        if: github.event_name != 'pull_request'
        run: |
          out=$(./cmake-build/apps/cli/euxis-cli --version)
          echo "$out"
          case "$out" in
            *"${EUXIS_VERSION}"*) ;;
            *) echo "::error::euxis-cli --version does not report ${EUXIS_VERSION}"; exit 1 ;;
          esac

      - name: Portable (Linux)
        # Static, baseline ISA, runs on an old CPU under QEMU, and on
        # Alpine, Debian 12, Rocky 8/9 and Fedora with a verified HTTPS
        # request to OSV.dev using each host's CA bundle.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user >/dev/null
          scripts/release/check-portable-linux.sh cmake-build

      - name: Self-contained (macOS)
        # Only system libraries, and a verified HTTPS request (OSV.dev)
        # with Homebrew's OpenSSL directory moved away, as on a Mac
        # without Homebrew. TLS trusts the system Keychain (cpp-httplib
        # loads its roots; IXWebSocket uses Secure Transport on Apple),
        # so no CA bundle file is involved.
        if: runner.os == 'macOS'
        run: |
          bin=cmake-build/apps/cli/euxis-cli
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
            echo "::error::the macOS binary links libraries outside macOS (above)"
            exit 1
          fi
          ossl_dir="$(brew --prefix)/etc/openssl@4"
          sudo mv "$ossl_dir" "$ossl_dir.hidden"
          purl='pkg:npm/lodash@4.17.20'
          HOME=/tmp "$bin" vulndb query "$purl" --json | grep -q GHSA-
          echo "TLS ok without Homebrew"
          sudo mv "$ossl_dir.hidden" "$ossl_dir"

      - name: Package
        id: package
        run: |
          mkdir -p dist
          BIN="euxis-${EUXIS_VERSION}-${{ matrix.target }}"
          cp cmake-build/apps/cli/euxis-cli "dist/${BIN}"
          (cd dist && tar -czf "${BIN}.tar.gz" "${BIN}")
          rm "dist/${BIN}"
          if [ "$RUNNER_OS" = macOS ]; then DBG="${BIN}.dSYM"; else DBG="${BIN}.debug"; fi
          tar -czf "dist/${BIN}-debug.tar.gz" -C cmake-build/apps/cli "$DBG"
          (cd dist && shasum -a 256 "${BIN}.tar.gz" > "${BIN}.tar.gz.sha256")
          (cd dist && shasum -a 256 "${BIN}-debug.tar.gz" > "${BIN}-debug.tar.gz.sha256")
          echo "archive=dist/${BIN}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "debug_archive=dist/${BIN}-debug.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign (keyless via Sigstore OIDC)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          for f in "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.debug_archive }}"; do
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done

      - name: Generate SLSA build provenance (in-toto Statement)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.debug_archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: euxis-${{ matrix.target }}
          path: dist/*

  linux-packages:
    name: Build .deb + .rpm packages
    runs-on: ${{ matrix.runner_override || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cmake_arch_flag: ""
          - arch: arm64
            cmake_arch_flag: ""
            runner_override: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          # g++-14 comes from the Ubuntu 24.04 archive (no toolchain PPA).
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 libsodium-dev libsqlite3-dev \
            pkg-config rpm
          echo "CC=gcc-14"  >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Configure (Release + install prefix)
        run: |
          cmake -B cmake-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DEUXIS_NATIVE_ARCH=OFF \
            -DEUXIS_DISABLE_SANITIZERS=ON \
            ${{ matrix.cmake_arch_flag }}

      - name: Build CLI target
        # A bare `--parallel` is an unbounded `make -j`: on v0.0.12 it
        # started every euxis-cli-lib TU at once and the job was killed
        # (exit 143) two minutes later. Same cap as the build job.
        run: cmake --build cmake-build --parallel 2 --target euxis-cli

      - name: No sanitizer runtime linked
        run: |
          ldd cmake-build/apps/cli/euxis-cli
          if ldd cmake-build/apps/cli/euxis-cli | grep -Ei 'asan|ubsan|tsan|lsan'; then
            echo "::error::packaged binary links a sanitizer runtime"
            exit 1
          fi

      - name: Emit .deb + .rpm via CPack
        run: |
          mkdir -p dist
          cd cmake-build
          cpack -G DEB -D CPACK_PACKAGE_FILE_NAME="euxis-${EUXIS_VERSION}-linux-${{ matrix.arch }}"
          cpack -G RPM -D CPACK_PACKAGE_FILE_NAME="euxis-${EUXIS_VERSION}-linux-${{ matrix.arch }}"
          mv ./*.deb ./*.rpm ../dist/ 2>/dev/null || true
          cd ../dist
          ls -la

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: euxis-packages-linux-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish release
    # linux-packages is intentionally not in `needs:`. Its stalls and
    # kills (run #27888557585, v0.0.12) came from an unbounded
    # `make -j`, now capped; attaching .deb/.rpm to releases is a
    # separate follow-up. The job still runs in parallel, and on pull
    # requests that touch this file, so it is validated without
    # re-running the whole workflow.
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # compose_notes.py needs the tags and history

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          # Only the euxis-* artifacts; the docker/buildx job uploads a
          # zero-byte attestation artifact with tildes in its name
          # ("…~…~…dockerbuild") that breaks download-artifact@v4's
          # extraction path, failing the whole step "after 5 retries".
          pattern: "euxis-*"
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          ls -la

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.cosign.bundle \
            dist/SHA256SUMS

      # The release title is "euxis <version>" without the tag's leading
      # "v" (standards: Key Release Invariants). Left unset, GitHub titles
      # the release with the bare tag, as v0.0.15 and v0.0.16 were.
      - name: Release title
        id: title
        run: echo "name=euxis ${EUXIS_VERSION#v}" >> "$GITHUB_OUTPUT"

      # Highlights come from .github/releases/<tag>.md at the tag; the
      # script adds What's Changed, Checksums and the Full Changelog link,
      # and fails (so nothing is published) when a piece is missing.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same globs as `files:` below: every attached asset.
          (cd dist && sha256sum -- *.tar.gz *.tar.gz.sha256 *.cosign.bundle SHA256SUMS) \
            > release-sums.txt
          python3 scripts/release/compose_notes.py "$EUXIS_VERSION" \
            --sums release-sums.txt > release-notes.md
          cat release-notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.EUXIS_VERSION }}
          name: ${{ steps.title.outputs.name }}
          body_path: release-notes.md
          # `dist/*.deb` and `dist/*.rpm` are intentionally absent: the
          # linux-packages job is decoupled from publish (see PR #106).
          # The .tar.gz / .sha256 / cosign bundles + Docker image are the
          # distribution channel; attaching .deb/.rpm is a separate
          # follow-up. Keeping fail_on_unmatched_files=true so an
          # unintentional regression on the *present* artifacts still
          # surfaces immediately.
          fail_on_unmatched_files: true
          # Each file must match exactly one pattern: v0.0.13 listed
          # SHA256SUMS.cosign.bundle twice (here and via *.cosign.bundle),
          # the duplicate upload replaced the first, and publish failed
          # with a 404 on the asset it had just deleted.
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.cosign.bundle
            dist/SHA256SUMS

  docker:
    name: Build and push Docker image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: euxis-linux-amd64
          path: dist

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: euxis-linux-arm64
          path: dist

      - name: Extract binaries for image build context
        run: |
          # The Dockerfile uses COPY ctx/${TARGETPLATFORM}/euxis /euxis
          # where TARGETPLATFORM is "linux/amd64" or "linux/arm64" —
          # slash-separated, NOT "linux-amd64" with a hyphen. The old
          # form caused: 'failed to calculate checksum of ref ...
          # "/ctx/linux/amd64/euxis": not found'. Use the slashed paths.
          mkdir -p ctx/linux/amd64 ctx/linux/arm64
          tar -xzf "dist/euxis-${EUXIS_VERSION}-linux-amd64.tar.gz" -C ctx/linux/amd64 --strip-components=0
          tar -xzf "dist/euxis-${EUXIS_VERSION}-linux-arm64.tar.gz" -C ctx/linux/arm64 --strip-components=0
          mv "ctx/linux/amd64/euxis-${EUXIS_VERSION}-linux-amd64" ctx/linux/amd64/euxis
          mv "ctx/linux/arm64/euxis-${EUXIS_VERSION}-linux-arm64" ctx/linux/arm64/euxis

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/release/Dockerfile.scratch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/euxis:${{ env.EUXIS_VERSION }}
            ghcr.io/${{ github.repository_owner }}/euxis:latest
          provenance: true
          sbom: true
